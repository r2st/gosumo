# ============================================================
# GoSumo — Production / Staging stack (single Hetzner VPS)
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Edge is handled by Cloudflare: the `cloudflared` tunnel publishes the
# API to the internet, so NO application port is exposed on the host.
# Data-store ports bind to 127.0.0.1 only (loopback), never 0.0.0.0.
# ============================================================

name: gosumo-prod

networks:
  gosumo-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ----------------------------------------------------------
  # API — NestJS (HTTP + WebSocket gateway)
  # ----------------------------------------------------------
  api:
    image: ghcr.io/r2st/gosumo-api:${IMAGE_TAG:-latest}
    # Fallback to local build if the registry image is unavailable:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: gosumo-api
    restart: always
    env_file: [.env.prod]
    environment:
      NODE_ENV: production
      PORT: 3000
    # Run pending migrations, then boot. (Idempotent; safe on every start.)
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.prisma && node dist/main.js"
    expose:
      - '3000' # internal only — reached via cloudflared, not published
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1024M }
    logging: *default-logging
    networks: [gosumo-net]

  # ----------------------------------------------------------
  # Worker — BullMQ async jobs (AI, campaigns, analytics)
  # Same image as the API; different entrypoint.
  # ----------------------------------------------------------
  worker:
    image: ghcr.io/r2st/gosumo-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: gosumo-worker
    restart: always
    env_file: [.env.prod]
    environment:
      NODE_ENV: production
      WORKER_MODE: 'true' # main.ts boots queue processors instead of HTTP
    command: ['node', 'dist/main.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f dist/main.js || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }
    logging: *default-logging
    networks: [gosumo-net]

  # ----------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gosumo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gosumo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gosumo_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Loopback-only: reachable from the host for psql/backups, never public.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gosumo} -d ${POSTGRES_DB:-gosumo_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1536M }
    logging: *default-logging
    networks: [gosumo-net]

  # ----------------------------------------------------------
  # Redis 7 — cache, sessions, BullMQ broker, pub/sub
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gosumo-redis
    restart: always
    # noeviction is required for BullMQ durability (never drop job data).
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 384mb --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    logging: *default-logging
    networks: [gosumo-net]

  # ----------------------------------------------------------
  # Qdrant — vector store for RAG
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gosumo-qdrant
    restart: always
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      # Protect the vector store with an API key (set in .env.prod).
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1024M }
    logging: *default-logging
    networks: [gosumo-net]

  # ----------------------------------------------------------
  # Cloudflare Tunnel — the ONLY ingress path to the internet.
  # No inbound ports open on the VPS firewall (80/443 stay closed).
  # Token is provisioned in the Cloudflare Zero Trust dashboard.
  # ----------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gosumo-cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      api: { condition: service_healthy }
    logging: *default-logging
    networks: [gosumo-net]

  # ----------------------------------------------------------
  # Uptime Kuma — self-hosted uptime monitoring + alerting.
  # Reach it privately via `cloudflared access` or an SSH tunnel.
  # ----------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: gosumo-uptime-kuma
    restart: always
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./monitoring/uptime-kuma:/app/data
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 256M }
    logging: *default-logging
    networks: [gosumo-net]
