# ============================================================
# GoSumo — CI/CD: build, test, publish image, deploy to Hetzner
#
# Flow:
#   push to main  ->  lint + test  ->  build & push image to GHCR
#                 ->  SSH into Hetzner VPS  ->  pull & restart stack
#
# Required GitHub repo secrets (Settings -> Secrets -> Actions):
#   HETZNER_HOST          public IP / hostname of the VPS
#   HETZNER_SSH_USER      deploy user (e.g. "deploy")
#   HETZNER_SSH_KEY       private SSH key (the deploy keypair)
#   HETZNER_SSH_PORT      SSH port (optional, default 22)
# GHCR auth uses the built-in GITHUB_TOKEN — no extra secret needed.
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api # -> ghcr.io/r2st/gosumo-api

jobs:
  # ----------------------------------------------------------
  # 1. Lint + unit tests (runs on PRs and on main)
  # ----------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gosumo/database generate

      - name: Lint
        run: pnpm lint

      - name: Type-check & build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

  # ----------------------------------------------------------
  # 2. Build & push image to GHCR (main only)
  # ----------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # 3. Deploy to Hetzner VPS over SSH (main only)
  # ----------------------------------------------------------
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/gosumo
            # Pull the latest compose file & app code (deploy keeps a checkout here)
            git pull --ff-only origin main
            # Authenticate to GHCR to pull the freshly built image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=latest
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api worker
            # Recreate only changed services; migrations run via the api start command
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            # Drop dangling images to reclaim disk on the small VPS
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
